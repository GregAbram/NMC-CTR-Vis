# vista_nginx.conf

upstream django {
    server unix:///vista/vista.sock; # for a file socket
}

# configuration of the server
server {

    # the port your site will be served on
    listen      8000;

    # the domain name it will serve for

    server_name 127.0.0.1;
    charset     utf-8;

    # max upload size
    client_max_body_size 75M;  

    # Django media
    location /media  {
        alias /vista/media;
    }

    location /static {
        alias /vista/static; 
    }

    # Finally, send all non-media requests to the Django server.

    location / {
        uwsgi_pass  django;
        proxy_read_timeout 300s;
        include     /vista/NMC-CTR-Vis/docker/uwsgi_params;
    }
}
